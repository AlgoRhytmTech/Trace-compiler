name: Build and Release TRACE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: trace-linux-x86_64
          - os: windows-latest
            name: trace-windows-x86_64.exe
          - os: macos-14
            name: trace-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build TRACE
        run: |
          pyinstaller --onefile --name ${{ matrix.name }} src/__main__.py

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/trace-linux-x86_64/trace-linux-x86_64
            release/trace-windows-x86_64.exe/trace-windows-x86_64.exe
            release/trace-macos-arm64/trace-macos-arm64
          generate_release_notes: true